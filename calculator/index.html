<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>RGB Calculator Pro</title>
<style>
:root{--bg:#080b12;--panel:#111827;--key:#1b2636;--fg:#f8fafc;--muted:#94a3b8;--accent:#38bdf8}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;padding:15px;background:var(--bg);color:var(--fg);font-family:system-ui,Arial,sans-serif}
body.white{--bg:#edf2f7;--panel:#fff;--key:#e2e8f0;--fg:#172033;--muted:#64748b;--accent:#0284c7}
body.dark{--bg:#080b12;--panel:#111827;--key:#1b2636;--fg:#f8fafc;--muted:#94a3b8;--accent:#38bdf8}
.app{max-width:440px;margin:auto}
header{display:flex;justify-content:space-between;align-items:center;margin:5px 0 18px;gap:8px}
h1{font-size:20px;margin:0;font-weight:900;letter-spacing:.5px}
.rgbtext{color:#38bdf8}
body.rgb .rgbtext{background:linear-gradient(90deg,#ff4141,#ffcb35,#27df75,#25caff,#a44bff,#ff4141);background-size:250% 100%;color:transparent;background-clip:text;-webkit-background-clip:text;animation:txt 7s linear infinite}
@keyframes txt{to{background-position:250% 50%}}
.circle{width:42px;height:42px;flex-shrink:0;border:1px solid #ffffff18;border-radius:13px;background:var(--panel);color:var(--fg);font-size:19px;cursor:pointer}
.display{background:var(--panel);border:1px solid #ffffff12;border-radius:22px;padding:18px;min-height:150px;display:flex;flex-direction:column;justify-content:flex-end;margin-bottom:13px;overflow:hidden}
.caption{font-size:11px;color:var(--muted);letter-spacing:1px}
.expression{font-size:clamp(22px,6vw,32px);text-align:right;overflow-wrap:anywhere;min-height:40px;margin:8px 0}
.result{font-size:clamp(29px,8vw,42px);font-weight:800;text-align:right;overflow-wrap:anywhere;min-height:50px}
.toolbar{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:12px}
.tool{padding:11px 3px;border:1px solid #ffffff16;border-radius:12px;background:var(--panel);color:var(--fg);font-size:12px;font-weight:700;cursor:pointer}
.keys{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.key{height:59px;min-width:0;border:1px solid #ffffff12;border-radius:16px;background:var(--key);color:var(--fg);font-size:20px;font-weight:650;cursor:pointer}
.key:active,.tool:active{filter:brightness(1.3);transform:scale(.98)}
.key.op{color:var(--accent)}
.key.equal{background:var(--accent);color:#fff}
body.rgb .key.rgbkey{color:#fff!important;background:linear-gradient(115deg,#ed344c,#ed8b21,#16a96a,#087fc4,#7538c8,#ed344c);background-size:250% 250%;animation:btn 9s linear infinite}
body.rgb .key.equal{color:#fff!important}
@keyframes btn{to{background-position:250% 50%}}
footer{text-align:center;color:var(--muted);font-size:10px;margin:17px 0 5px}
.modal{display:none;position:fixed;inset:0;z-index:9999;padding:16px;background:#000b;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);align-items:center;justify-content:center}
.modal.show{display:flex}
.dialog{width:100%;max-width:390px;max-height:86dvh;overflow:auto;background:var(--panel);color:var(--fg);border:1px solid #ffffff25;border-radius:22px;padding:18px;box-shadow:0 20px 70px #0008}
.dialog-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:13px}
.dialog-head h2{font-size:19px;margin:0}
.close{width:36px;height:36px;flex-shrink:0;border:0;border-radius:11px;background:var(--key);color:var(--fg);font-size:23px;cursor:pointer}
label{display:block;font-size:12px;color:var(--muted);margin:13px 0 6px}
select{width:100%;padding:12px;border:1px solid #ffffff18;border-radius:11px;background:var(--key);color:var(--fg);font-size:14px}
.preview{font-size:22px;font-weight:800;margin-top:10px;overflow-wrap:anywhere}
.dialog-actions{display:flex;gap:8px;margin-top:17px}
.dialog-actions button{flex:1;padding:11px 5px;border:1px solid #ffffff18;border-radius:11px;background:var(--key);color:var(--fg);cursor:pointer}
.primary{background:var(--accent)!important;color:#fff!important}
.history-row{padding:12px 2px;border-bottom:1px solid #ffffff14;overflow-wrap:anywhere;cursor:pointer}
.history-row small{display:block;color:var(--muted);margin-bottom:4px}
.empty{color:var(--muted);font-size:13px;padding:10px 0}
</style>
</head>
<body class="rgb">
<main class="app">
<header>
<h1 class="rgbtext" id="appTitle">RGB CALCULATOR</h1>

function formatNumber(n){
 const styles={latn:"en-US",arab:"ar",arabext:"fa",deva:"hi",beng:"bn",thai:"th",fullwide:"ja-JP-u-nu-fullwide",mymr:"my",khmr:"km"};
 try{return new Intl.NumberFormat(styles[$("digits").value]||"en-US",{useGrouping:false,maximumFractionDigits:10}).format(n)}
 catch(e){return String(n)}
}
function localizeExpression(s){
 return s.replace(/\d+(?:\.\d+)?/g,m=>{
  let n=Number(m);return Number.isFinite(n)?formatNumber(n):m;
 });
}

/* Parser matematika tanpa eval */
const Parser={
 evaluate(s){
  let i=0;
  function ws(){while(i<s.length&&/\s/.test(s[i]))i++}
  function eat(c){ws();if(s.slice(i,i+c.length)===c){i+=c.length;return true}return false}
  function primary(){
   ws();
   if(eat("+"))return primary();
   if(eat("-"))return -primary();
   if(eat("(")){let v=add();if(!eat(")"))throw Error();return v}
   if(eat("sqrt(")){let v=add();if(!eat(")")||v<0)throw Error();return Math.sqrt(v)}
   if(eat("pi"))return Math.PI;
   let m=s.slice(i).match(/^(?:\d+\.?\d*|\.\d+)(?:e[+-]?\d+)?/i);
   if(!m)throw Error();
   i+=m[0].length;return Number(m[0]);
  }
  function power(){let a=primary();if(eat("^"))a=Math.pow(a,power());return a}
  function mul(){
   let a=power();
   while(true){
    if(eat("*"))a*=power();
    else if(eat("/")){let b=power();if(b===0)throw Error();a/=b}
    else if(eat("%"))a%=power();
    else break;
   }return a;
  }
  function add(){
   let a=mul();
   while(true){if(eat("+"))a+=mul();else if(eat("-"))a-=mul();else break}
   return a;
  }
  let v=add();ws();
  if(i!==s.length||!Number.isFinite(v))throw Error();
  return v;
 }
};

function update(){
 $("expr").textContent=expression?localizeExpression(expression):"0";
 if(!expression){$("result").textContent="0";return}
 try{$("result").textContent=formatNumber(Parser.evaluate(expression))}
 catch(e){$("result").textContent="…"}
}
function add(v){expression+=v;update()}
function clear(){expression="";update()}
function back(){expression=expression.slice(0,-1);update()}
function equals(){
 if(!expression)return;
 try{
  let result=Parser.evaluate(expression);
  history.unshift({e:expression,r:result});history=history.slice(0,50);
  save("rgbcalc_history",JSON.stringify(history));
  expression=String(Number(result.toPrecision(12)));
  update();renderHistory();
 }catch(e){$("result").textContent=T().error}
}
$("keypad").addEventListener("click",e=>{
 const b=e.target.closest("button");if(!b)return;
 if(b.dataset.action==="clear")clear();
 else if(b.dataset.action==="back")back();
 else if(b.dataset.action==="equals")equals();
 else if(b.dataset.value)add(b.dataset.value);
});

function renderHistory(){
 const box=$("historyList");box.replaceChildren();
 if(!history.length){const d=document.createElement("div");d.className="empty";d.textContent=T().empty;box.append(d);return}
 history.forEach(item=>{
  const row=document.createElement("div");row.className="history-row";
  const small=document.createElement("small");small.textContent=localizeExpression(item.e);
  const strong=document.createElement("strong");strong.textContent=formatNumber(item.r);
  row.append(small,strong);
  row.addEventListener("click",()=>{expression=item.e;update();closeModal("historyModal")});
  box.append(row);
 });
}
window.clearHistory=function(){history=[];save("rgbcalc_history","[]");renderHistory()};

});
