<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Zyraxx - Silver Edition</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg-deep: #050507;
            --glass-bg: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.1);
            --accent-silver: #A8A9AD;
            --accent-silver-light: #C0C0C0;
            --accent-green: #00ff88;
            --gradient-primary: linear-gradient(135deg, #A8A9AD 0%, #C0C0C0 100%);
            --text-main: #c0c0c0;
            --card-solid: #0a0a0f;
            --card-border: #1a1a2e;
            --font-main: 'Share Tech Mono', monospace;
            --font-title: 'Orbitron', sans-serif;
        }

        * { 
            margin: 0; padding: 0; box-sizing: border-box; 
            -webkit-tap-highlight-color: transparent; 
        }
        
        body {
            background-color: var(--bg-deep);
            color: var(--text-main);
            font-family: var(--font-main);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        /* Particles - Silver Style */
        #particle-container {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1; pointer-events: none;
        }
        .particle {
            position: absolute;
            background: var(--accent-silver);
            border-radius: 2px;
            animation: floatUp linear infinite;
            box-shadow: 0 0 10px var(--accent-silver);
            opacity: 0.3;
        }
        @keyframes floatUp {
            0% { transform: translateY(110vh) rotate(0deg); opacity: 0; }
            50% { opacity: 0.5; }
            100% { transform: translateY(-10vh) rotate(360deg); opacity: 0; }
        }

        header {
            display: flex; align-items: center; justify-content: space-between;
            padding: 45px 25px 20px 25px;
            background: var(--bg-deep);
            border-bottom: 1px solid var(--glass-border);
            position: sticky; top: 0; z-index: 100;
        }
        
        .brand-title { 
            font-family: var(--font-title); font-size: 18px; font-weight: 700; 
            background: var(--gradient-primary);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 2px;
        }

        .back-btn { 
            color: var(--text-main); width: 40px; height: 40px;
            display: flex; align-items: center; justify-content: center; 
            border-radius: 8px; background: rgba(255,255,255,0.03);
            border: 1px solid var(--glass-border);
            transition: 0.3s;
            text-decoration: none;
        }
        .back-btn:hover { background: rgba(168, 169, 173, 0.1); border-color: var(--accent-silver); color: #fff; }

        main { 
            flex: 1; overflow-y: auto; padding: 20px;
            scroll-behavior: smooth;
        }

        .page-header { margin-bottom: 25px; text-align: center; }
        .page-title-text {
            font-family: var(--font-title); font-size: 22px; font-weight: 700;
            background: var(--gradient-primary);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 3px;
        }

        .banner-card {
            width: 100%; aspect-ratio: 16/7; border-radius: 12px; 
            position: relative; overflow: hidden;
            border: 1px solid var(--glass-border);
            margin-bottom: 25px;
        }
        .banner-img { 
            width: 100%; height: 100%; object-fit: cover; 
            filter: grayscale(0.7) brightness(0.6) contrast(1.1);
        }

        .team-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; margin-bottom: 40px; }

        .member-card {
            background: rgba(255,255,255,0.03);
            backdrop-filter: blur(10px);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            padding: 20px 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: 0.3s;
            cursor: pointer;
        }
        .member-card:hover {
            transform: translateY(-5px);
            border-color: var(--accent-silver);
            box-shadow: 0 5px 15px rgba(168, 169, 173, 0.15);
        }

        .avatar-box { position: relative; width: 70px; height: 70px; margin-bottom: 12px; }
        .avatar-img {
            width: 100%; height: 100%; border-radius: 8px; object-fit: cover;
            border: 2px solid var(--accent-silver);
            padding: 2px; background: #000;
        }
        
        .status-dot {
            position: absolute; bottom: -4px; right: -4px; width: 14px; height: 14px;
            border-radius: 50%; background: #333; border: 2px solid #000;
        }
        .status-dot.online { background: var(--accent-green); box-shadow: 0 0 10px var(--accent-green); }

        .m-name {
            font-family: var(--font-title); font-size: 11px; font-weight: 600;
            color: #fff; margin-bottom: 8px; text-align: center;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis; width: 100%;
        }

        .m-role {
            font-size: 9px; color: #050507; background: var(--gradient-primary);
            padding: 4px 10px; border-radius: 4px; font-weight: 700;
            text-transform: uppercase; letter-spacing: 1px;
            border: 1px solid var(--accent-silver);
        }

        /* Modal Silver Theme */
        .modal-overlay {
            position: fixed; inset: 0; background: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(5px); z-index: 1000; 
            opacity: 0; visibility: hidden; display: flex; align-items: center; justify-content: center;
            transition: 0.4s;
        }
        .modal-overlay.active { opacity: 1; visibility: visible; }

        .tech-card {
            background: #0a0a0f; width: 85%; max-width: 350px; border-radius: 15px;
            border: 1px solid var(--accent-silver); position: relative; padding: 40px 20px;
            text-align: center;
        }

        .close-modal {
            position: absolute; top: 15px; right: 15px;
            color: var(--accent-silver); font-size: 24px; cursor: pointer;
            transition: 0.3s;
        }
        .close-modal:hover { color: #fff; }

        .tech-avatar {
            width: 90px; height: 90px; border-radius: 12px;
            border: 2px solid var(--accent-silver); margin-bottom: 15px;
            filter: grayscale(0.3) contrast(1.1);
        }

        .tech-name { font-family: var(--font-title); font-size: 18px; color: #fff; margin-bottom: 5px; }
        .tech-username { font-size: 14px; background: var(--gradient-primary); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 20px; display: block; }
        
        .tech-stats-box {
            display: flex; justify-content: space-around; background: rgba(255,255,255,0.03);
            border: 1px solid var(--glass-border); border-radius: 10px; padding: 15px; margin-bottom: 20px;
        }
        .ts-label { font-size: 10px; color: var(--text-muted); display: block; text-transform: uppercase; }
        .ts-value { font-family: var(--font-title); font-size: 12px; color: #fff; }

        .tech-bio { font-size: 12px; color: var(--text-muted); line-height: 1.6; margin-bottom: 25px; }

        .tech-btn {
            background: var(--gradient-primary); color: #050507; padding: 15px;
            border-radius: 8px; text-decoration: none; display: flex;
            align-items: center; justify-content: center; gap: 10px;
            font-family: var(--font-title); font-size: 12px; font-weight: 700;
            transition: 0.3s;
        }
        .tech-btn:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(168,169,173,0.3); }

        .text-muted { color: var(--text-muted); }
    </style>
</head>
<body>

    <div id="particle-container"></div>

    <header>
        <a href="/dashboard" class="back-btn">
            <i class="fas fa-chevron-left"></i>
        </a>
        <div class="brand-title">Zyraxx</div>
        <div style="width:40px"></div>
    </header>

    <main>
        <div class="page-header">
            <h1 class="page-title-text">SUPPORT TEAM</h1>
        </div>

        <div class="banner-card">
            <img src="https://i.top4top.io/p_3648647u41.jpg" class="banner-img" onerror="this.src='https://i.top4top.io/p_36451wk7n1.jpg'">
        </div>

        <div class="team-grid" id="teamGrid"></div>
    </main>
    <div class="modal-overlay" id="profileModal">
        <div class="tech-card">
            <div class="close-modal" id="closeModal"><i class="fas fa-times-circle"></i></div>
            <img src="" class="tech-avatar" id="modalImg">
            <h2 class="tech-name" id="modalName">Zrrprince</h2>
            <span class="tech-username" id="modalUser">@zrrprince</span>
            
            <div class="tech-stats-box">
                <div class="ts-item">
                    <span class="ts-label">Rank</span>
                    <span class="ts-value" id="modalRole">-</span>
                </div>
                <div class="ts-item">
                    <span class="ts-label">Status</span>
                    <span class="ts-value" id="modalStatus" style="color:#00ff88">ONLINE</span>
                </div>
            </div>

            <div class="tech-bio" id="modalBio">...</div>

            <a href="#" class="tech-btn" id="modalLink" target="_blank">
                <i class="fa-brands fa-telegram"></i> CONTACT TELE
            </a>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Silver Particles
            const container = document.getElementById('particle-container');
            const createParticle = () => {
                const p = document.createElement('div');
                p.className = 'particle';
                const size = Math.random() * 3 + 1; 
                p.style.width = p.style.height = `${size}px`;
                p.style.left = `${Math.random() * 100}vw`;
                p.style.animationDuration = `${Math.random() * 5 + 5}s`;
                container.appendChild(p);
                setTimeout(() => p.remove(), 10000);
            };
            setInterval(createParticle, 500);

            // Member Data (semua data tetap sama)
            const members = [
                { name: "ZRRPRINCEOFFC", username: "@zrrprince", role: "Owner", type: "DEVELOPER", status: "online", bio: "REAL DEV APK REAPERS", avatar: "https://files.catbox.moe/94cktb.png", link: "https://t.me/zrrprince" },
                { name: "ZRRPRINCE 2", username: "@zrrprince1", role: "Owner", type: "DEV 2", status: "online", bio: "BACKUP ACCOUNT ZRRPRINCEOFFC", avatar: "https://files.catbox.moe/rtjx0z.jpg", link: "https://t.me/zrrprince1" },
                { name: "Viyyyyy", username: "@viyyyyyyy6", role: "Admin", type: "MY SUPPORT", status: "online", bio: "GIRL ZRR", avatar: "https://f.top4top.io/p_3645pz4bd1.jpg", link: "https://t.me/viyyyyyyy6" },
                { name: "DHNN", username: "@adhankakap", role: "Friends", type: "Friends", status: "online", bio: "Friends", avatar: "https://files.catbox.moe/oq1q8c.jpg", link: "https://t.me/adhankakap" },
                { name: "DANZZ", username: "@Dannlempok", role: "Friends", type: "Kacung", status: "online", bio: "Kacungnya ZRR", avatar: "https://g.top4top.io/p_3645b3izi1.jpg", link: "https://t.me/Dannlempok" },
            ];

            const grid = document.getElementById('teamGrid');
            members.forEach((m, i) => {
                const card = document.createElement('div');
                card.className = 'member-card';
                
                card.innerHTML = `
                    <div class="avatar-box">
                        <img src="${m.avatar}" class="avatar-img" onerror="this.src='https://ui-avatars.com/api/?name=${encodeURIComponent(m.name)}&background=0a0a0f&color=A8A9AD'">
                        <div class="status-dot ${m.status}"></div>
                    </div>
                    <div class="m-name">${m.name}</div>
                    <div class="m-role">${m.role}</div>
                `;
                card.onclick = () => openModal(m);
                grid.appendChild(card);
            });

            const modal = document.getElementById('profileModal');
            function openModal(data) {
                document.getElementById('modalImg').src = data.avatar;
                document.getElementById('modalName').textContent = data.name;
                document.getElementById('modalUser').textContent = data.username;
                document.getElementById('modalRole').textContent = data.role;
                document.getElementById('modalBio').textContent = data.bio;
                document.getElementById('modalLink').href = data.link;
                modal.classList.add('active');
            }
            
            document.getElementById('closeModal').onclick = () => modal.classList.remove('active');
            modal.onclick = (e) => { if(e.target === modal) modal.classList.remove('active'); };
        });
    </script>
</body>
</html>
